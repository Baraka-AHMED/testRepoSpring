<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .navigation {
            background-color: #4CAF50;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navigation a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin-right: 15px;
        }

        .logout-button {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .courses {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .course {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 100%;
        }

        .course h3 {
            font-size: 1.2em;
            color: #333;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            margin-top: 10px;
            font-size: 14px;
            border-radius: 5px;
            text-decoration: none;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-danger {
            background-color: #f44336;
            color: white;
        }

        .btn-info {
            background-color: #17a2b8;
            color: white;
        }

        .exams {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .exam {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 15px;
        }

        .exam h3 {
            font-size: 1.1em;
            color: #333;
        }

        .exam p {
            color: #555;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <!-- Barre de navigation -->
    <div class="navigation">
        <a href="/teacher/dashboard">🏠 Tableau de bord</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">🚪 Se déconnecter</button>
        </form>
    </div>

    <div class="container">
        <h1>Bienvenue, <span th:text="${name}">Nom de l'enseignant</span> !</h1>

        <!-- Section des cours -->
        <section>
            <h2>Vos Cours</h2>
            <div class="courses">
                <!-- Boucle pour afficher chaque cours -->
                <div th:each="course : ${teacherCourses}">
                    <div class="course">
                        <h3 th:text="${course.title}">Titre du cours</h3>

                        <!-- Bouton pour voir les étudiants inscrits -->
                        <a th:href="@{/teacher/course-students/{courseId}(courseId=${course.id})}" class="btn btn-info">👨‍🎓 Voir les étudiants inscrits</a>
                            
                        <!-- Bouton pour ajouter un examen -->
                        <a th:href="@{/teacher/create-exam/{courseId}(courseId=${course.id})}" class="btn btn-primary">➕ Ajouter un examen</a>

                        <!-- Examens associés au cours -->
                        <div class="exams">
                            <h4>Examens associés :</h4>

                            <div th:each="exam : ${course.exams}">
                                <div class="exam">
                                    <h3 th:text="${exam.examTitle}">Titre de l'examen</h3>
                                    <p>📅 Date : <span th:text="${exam.examDate}"></span></p>
                                    <p>📌 État : <span th:text="${exam.examStatus}"></span></p>

                                    <!-- Actions basées sur l'état de l'examen -->
                                    <div th:switch="${exam.examStatus.name()}">
                                        <div th:case="'DRAFT'">
                                            <a th:href="@{/teacher/manage-exam/{courseId}/{examId}(courseId=${course.id}, examId=${exam.id})}" class="btn btn-info">⚙ Gérer l'examen</a>
                                        </div>

                                        <div th:case="'PUBLISHED'">
                                            <a th:href="@{/teacher/manage-exam/{courseId}/{examId}(courseId=${course.id}, examId=${exam.id})}" class="btn btn-info">📄 Voir les détails</a>
                                            <a th:href="@{/teacher/exam-results/{examId}(examId=${exam.id})}" class="btn btn-primary">📊 Mettre les résultats</a>
                                        </div>

                                        <div th:case="'CLOSED'">
                                            <a th:href="@{/teacher/manage-exam/manage-exam/{courseId}/{examId}(courseId=${course.id}, examId=${exam.id})}" class="btn btn-info">📄 Voir les détails</a>
                                            <a th:href="@{/teacher/exam-results/{examId}(examId=${exam.id})}" class="btn btn-primary">📊 Voir les résultats</a>
                                        </div>
                                    </div>  
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
