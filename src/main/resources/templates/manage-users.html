<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exam Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<style>
    body {
        background-color: #f8f9fa;
        font-family: 'Poppins', sans-serif;
    }
    .container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        margin: 50px auto;
        max-width: 800px;
    }
    .btn-primary, .btn-danger {
        border-radius: 8px;
        padding: 12px 25px;
        font-size: 16px;
    }
    .form-control {
        border-radius: 10px;
        padding: 15px;
    }
    table {
        border-radius: 10px;
        overflow: hidden;
    }
    h1, h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    .dashboard-container {
        max-width: 1100px;
        margin: auto;
    }
</style>
    <meta charset="UTF-8">
    <title>Gestion des Utilisateurs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center">Gestion des Utilisateurs</h1>

    <!-- Tableau des utilisateurs -->
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nom d'utilisateur</th>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Actif</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <form th:action="@{/admin/update-user}" method="post">
                <input type="hidden" name="id" th:value="${user.userId}">
                <td th:text="${user.userId}"></td>
                <td th:text="${user.username}"></td>
                <td><input type="text" name="firstName" th:value="${user.firstName}" class="form-control"></td>
                <td><input type="text" name="lastName" th:value="${user.lastName}" class="form-control"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <select name="role" class="form-select">
                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:selected="${user.role == role}"></option>
                    </select>
                </td>
                <td>
                    <select name="active" class="form-select">
                        <option value="true" th:selected="${user.active}">Oui</option>
                        <option value="false" th:selected="${!user.active}">Non</option>
                    </select>
                </td>
                <td>
                    <button type="submit" class="btn btn-warning">Modifier</button>
                    <a th:href="@{/admin/delete-user(id=${user.userId})}" class="btn btn-danger">Supprimer</a>
                </td>
            </form>
        </tr>
        </tbody>
    </table>

    <a href="/admin/dashboard" class="btn btn-secondary mt-4">Retour</a>
</div>
</body>
</html>
