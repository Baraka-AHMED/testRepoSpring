<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Utilisateurs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center">Gestion des Utilisateurs</h1>

    <!-- Tableau des utilisateurs -->
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nom d'utilisateur</th>
            <th>Prénom</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Actif</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <form th:action="@{/admin/update-user}" method="post">
                <input type="hidden" name="id" th:value="${user.userId}">
                <td th:text="${user.userId}"></td>
                <td th:text="${user.username}"></td>
                <td><input type="text" name="firstName" th:value="${user.firstName}" class="form-control"></td>
                <td><input type="text" name="lastName" th:value="${user.lastName}" class="form-control"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <select name="role" class="form-select">
                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:selected="${user.role == role}"></option>
                    </select>
                </td>
                <td>
                    <select name="active" class="form-select">
                        <option value="true" th:selected="${user.active}">Oui</option>
                        <option value="false" th:selected="${!user.active}">Non</option>
                    </select>
                </td>
                <td>
                    <button type="submit" class="btn btn-warning">Modifier</button>
                    <a th:href="@{/admin/delete-user(id=${user.userId})}" class="btn btn-danger">Supprimer</a>
                </td>
            </form>
        </tr>
        </tbody>
    </table>

    <!-- Formulaire d'ajout d'utilisateur -->
    <h2 class="mt-4">Ajouter un Utilisateur</h2>
    <form th:action="@{/admin/add-user}" method="post">
        <div class="row">
            <div class="col-md-4">
                <label>Nom d'utilisateur:</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label>Email:</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label>Mot de passe:</label>
                <input type="password" name="password" class="form-control" required>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-4">
                <label>Prénom:</label>
                <input type="text" name="firstName" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label>Nom:</label>
                <input type="text" name="lastName" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label>Rôle:</label>
                <select name="role" class="form-select">
                    <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                </select>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-4">
                <label>Actif:</label>
                <select name="active" class="form-select">
                    <option value="true">Oui</option>
                    <option value="false">Non</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-success mt-3">Ajouter</button>
    </form>

    <a href="/admin/dashboard" class="btn btn-secondary mt-4">Retour</a>
</div>
</body>
</html>
