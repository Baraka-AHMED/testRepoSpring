<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voir l'examen</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
        .btn-primary, .btn-danger, .btn-secondary {
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 16px;
        }
        .card {
            margin-bottom: 20px;
        }
        .question-item {
            background-color: #f1f1f1;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 20px;
        }
        .question-title {
            font-weight: bold;
        }
        .question-number {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <!-- Barre de navigation (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Examen</a>
            <div class="d-flex">
                <a th:href="@{/student/dashboard}" class="btn btn-outline-secondary me-2">🏠 Accueil</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-danger">🚪 Déconnexion</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Titre de l'examen -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2 th:text="${exam.examTitle}">Titre de l'examen</h2>
            </div>
            <div class="card-body">
                <!-- Détails du cours et du professeur -->
                <p><strong>Cours :</strong> <span th:text="${exam.course.title}">Nom du cours</span></p>
                <p><strong>Professeur :</strong> <span th:text="${exam.teacher.lastName} + ' ' + ${exam.teacher.firstName}">Nom et prénom du professeur</span></p>
            </div>
        </div>

        <!-- Liste des questions -->
        <div>
            <h3>Questions :</h3>
            <div th:each="question, iterStat : ${exam.questions}">
                <div class="question-item">
                    <!-- Numéro de la question -->
                    <p class="question-number" th:text="'Question ' + ${iterStat.index + 1}">Question 1</p>
                    <p class="question-title" th:text="${question.questionTitle}">Titre de la question</p>
                    
                    <!-- Options de la question -->
                    <ul class="list-group">
                        <li class="list-group-item" th:text="${question.option1}">Option 1</li>
                        <li class="list-group-item" th:text="${question.option2}">Option 2</li>
                        <li class="list-group-item" th:text="${question.option3}">Option 3</li>
                        <li class="list-group-item" th:text="${question.option4}">Option 4</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
