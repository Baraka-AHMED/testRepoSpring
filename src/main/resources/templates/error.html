<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erreur Générale</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            text-align: center;
            margin-top: 100px;
        }
        .error-container h1 {
            font-size: 4em;
            color: #dc3545;
        }
        .error-container p {
            font-size: 1.2em;
            color: #6c757d;
        }
        .btn-custom {
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-container">
            <h1>Oups ! Une erreur est survenue.</h1>
            <p>Il semble qu'il y ait eu un problème avec la page que vous avez demandée.</p>
            <a href="/" class="btn btn-primary btn-lg btn-custom">Retour à l'accueil</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
