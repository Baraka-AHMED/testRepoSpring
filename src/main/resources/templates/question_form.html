<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Créer ou Modifier une Question</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }
        .container {
            width: 70%;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .navbar {
            background-color: #4CAF50;
        }
        .navbar a {
            color: white;
        }
        .form-group label {
            font-weight: bold;
        }
        .form-actions {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand" >Tableau de bord Professeur</span>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/teacher/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-danger text-white" href="/logout">Déconnexion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenu principal -->
    <div class="container">
        <h1 th:text="${isEdit} ? 'Modifier la Question ' : 'Créer une Question'"></h1>

        <!-- Formulaire de création ou modification de question -->
        <form th:action="${isEdit} ? '/teacher/update-question' : '/teacher/save-question'" method="post">
            <input type="hidden" name="examId" th:value="${exam.id}" />
            <input type="hidden" name="id" th:value="${isEdit} ? ${question.id} : ''" />

            <!-- Catégorie -->
            <div class="form-group">
                <label for="category">Catégorie</label>
                <input type="text" id="category" name="category" class="form-control" required 
                       th:value="${isEdit ? question.category : ''}" />
            </div>

            <!-- Niveau de difficulté -->
            <div class="form-group">
                <label for="difficultyLevel">Niveau de difficulté</label>
                <select id="difficultyLevel" name="difficultyLevel" class="form-control" required>
                    <option value="Facile" th:selected="${isEdit && question.difficultyLevel == 'Facile'}">Facile</option>
                    <option value="Intermédiaire" th:selected="${isEdit && question.difficultyLevel == 'Intermédiaire'}">Intermédiaire</option>
                    <option value="Difficile" th:selected="${isEdit && question.difficultyLevel == 'Difficile'}">Difficile</option>
                </select>
            </div>

            <!-- Question -->
            <div class="form-group">
                <label for="questionTitle">Titre de la question</label>
                <input type="text" id="questionTitle" name="questionTitle" class="form-control" required
                       th:value="${isEdit} ? ${question.questionTitle} : ''" />
            </div>

            <!-- Options -->
            <h5>Options :</h5>
            <div class="form-group">
                <label for="option1">Option 1</label>
                <input type="text" id="option1" name="option1" class="form-control" required
                       th:value="${isEdit} ? ${question.option1} : ''" />
            </div>
            <div class="form-group">
                <label for="option2">Option 2</label>
                <input type="text" id="option2" name="option2" class="form-control" required
                       th:value="${isEdit} ? ${question.option2} : ''" />
            </div>
            <div class="form-group">
                <label for="option3">Option 3</label>
                <input type="text" id="option3" name="option3" class="form-control" required
                       th:value="${isEdit} ? ${question.option3} : ''" />
            </div>
            <div class="form-group">
                <label for="option4">Option 4</label>
                <input type="text" id="option4" name="option4" class="form-control" required
                       th:value="${isEdit} ? ${question.option4} : ''" />
            </div>

            <!-- Réponse correcte -->
            <div class="form-group">
                <label for="rightAnswer">Réponse correcte</label>
                <select id="rightAnswer" name="rightAnswer" class="form-control" required>
                    <option value="1" th:selected="${isEdit && question.rightAnswer == '1'}">Option 1</option>
                    <option value="2" th:selected="${isEdit && question.rightAnswer == '2'}">Option 2</option>
                    <option value="3" th:selected="${isEdit && question.rightAnswer == '3'}">Option 3</option>
                    <option value="4" th:selected="${isEdit && question.rightAnswer == '4'}">Option 4</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                <span th:text="${isEdit} ? 'Mettre à jour' : 'Enregistrer'"></span> la question
            </button>

        </form>

        <br>

        <!-- Bouton pour revenir à la page précédente -->
        <a th:href="@{/teacher/manage-exam/{courseId}/{examId}(courseId=${exam.course.id}, examId=${exam.id})}" class="btn btn-danger">🔙 Retour à la gestion de l'examen</a>
    </div>
</body>
</html>
