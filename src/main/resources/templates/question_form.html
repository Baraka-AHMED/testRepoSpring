<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isEdit} ? 'Edit Question' : 'Add New Question'"></title>
<div class="container">
    <h2 th:text="${isEdit} ? 'Edit Question' : 'Add New Question'"></h2>

    <form th:action="@{/teacher/save-question}" method="post" th:object="${question}">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{exam}" />

        <label for="questionTitle">Question Title:</label>
        <textarea id="questionTitle" th:field="*{questionTitle}" required></textarea>

        <label for="category">Category:</label>
        <input type="text" id="category" th:field="*{category}" required />

        <label for="difficultyLevel">Difficulty:</label>
        <select id="difficultyLevel" th:field="*{difficultyLevel}">
            <option value="EASY">Easy</option>
            <option value="MEDIUM">Medium</option>
            <option value="HARD">Hard</option>
        </select>

        <label for="option1">Option 1:</label>
        <input type="text" id="option1" th:field="*{option1}" required />

        <label for="option2">Option 2:</label>
        <input type="text" id="option2" th:field="*{option2}" required />

        <label for="option3">Option 3:</label>
        <input type="text" id="option3" th:field="*{option3}" required />

        <label for="option4">Option 4:</label>
        <input type="text" id="option4" th:field="*{option4}" required />

        <label for="rightAnswer">Right Answer:</label>
        <input type="text" id="rightAnswer" th:field="*{rightAnswer}" required />

        <button type="submit" th:text="${isEdit} ? 'Save Changes' : 'Add Question'"></button>
    </form>
</div>

</body>
</html>
