<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Résultats de l'Examen</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }
        .container {
            width: 70%;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .navbar {
            background-color: #4CAF50;
        }
        .navbar a {
            color: white;
        }
        .table th, .table td {
            text-align: center;
        }
        .btn-block {
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Tableau de bord Professeur</a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/teacher/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-danger text-white" href="/logout">Déconnexion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenu principal -->
    <div class="container">
        <h1>Résultats de l'Examen : <span th:text="${exam.examTitle}"></span></h1>
        <h4>Cours concerné : <span th:text="${exam.course.title}"></span></h4>

        <!-- Liste des résultats sous forme de tableau -->
        <form th:action="@{/teacher/exam-results/validate/{examId}(examId=${exam.id})}" method="post">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Nom de l'étudiant</th>
                        <th>Note (0-20)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="resultDTO, iterStat : ${resultDTOs}">
						<td th:text="${resultDTO.student.userID}"></td>
                        <td th:text="${resultDTO.student.firstName} + ' ' + ${resultDTO.student.lastName}"></td>
                        <td>
                            <input type="number" class="form-control" name="resultDTOs[${iterStat.index}].score" 
                                   th:value="${resultDTO.score}" min="0" max="20" step="0.1" 
                                   th:disabled="${exam.examStatus == 'CLOSED'}" required />
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Si tous les résultats sont remplis, on affiche le bouton de validation -->
            <div class="form-group">
                <button type="submit" class="btn btn-success btn-block" th:disabled="${exam.examStatus == 'CLOSED' || #lists.isEmpty(resultDTOs)}">
                    Valider les résultats
                </button>
            </div>
        </form>

        <br>

        <!-- Si l'examen est publié et les résultats validés, on affiche un message -->
        <div th:if="${exam.examStatus == 'CLOSED'}">
            <div class="alert alert-success">
                <strong>Les résultats de l'examen sont validés et l'examen est maintenant fermé.</strong>
            </div>
        </div>

        <!-- Bouton pour revenir à la gestion des examens -->
        <a th:href="@{/teacher/exam/{examId}(examId=${exam.id})}" class="btn btn-danger">Retour à la gestion de l'examen</a>
    </div>
</body>
</html>
