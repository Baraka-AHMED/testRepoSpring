<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auth | Exam Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
    body {
        background-color: #f8f9fa;
        font-family: 'Poppins', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .auth-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
        text-align: center;
    }
    .auth-container h2 {
        margin-bottom: 20px;
        font-weight: 600;
    }
    .form-control {
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 15px;
    }
    .btn-primary {
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
        width: 100%;
    }
    .auth-footer {
        margin-top: 15px;
        font-size: 14px;
    }
</style>
</head>
<body>
    <div class="auth-container">
        <h2>📝 Register</h2>
        <form th:action="@{/register}" method="POST" th:object="${user}">
            <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="Username" required>
            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Email" required>
            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" placeholder="First Name" required>
            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" placeholder="Last Name" required>
            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Password" required>
            <select name="role" class="form-select">
                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:if="${role != 'ADMIN'}"></option>
            </select>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
    </div>
</body>
</html>
