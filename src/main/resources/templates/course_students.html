<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Étudiants inscrits</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 60%;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .student-list {
            list-style: none;
            padding: 0;
        }

        .student-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .btn-danger {
            background-color: #f44336;
            color: white;
            border: none;
        }

        .btn-success {
            background-color: #4CAF50;
            color: white;
            border: none;
        }

        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        form {
            margin-top: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand" >Tableau de bord Professeur</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/teacher/dashboard">🏠 Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-danger text-white" href="/logout">🚪 Déconnexion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Étudiants inscrits à <span th:text="${course.title}"></span></h1>

        <!-- Liste des étudiants inscrits -->
        <ul class="student-list">
            <li th:each="student : ${enrolledStudents}">
                <span th:text="|${student.userId} - ${student.firstName} ${student.lastName}"></span>
                <form th:action="@{/teacher/unsubscribe-student}" method="post">
                    <input type="hidden" name="courseId" th:value="${course.id}" />
                    <input type="hidden" name="studentId" th:value="${student.userId}" />
                    <button type="submit" class="btn btn-danger">❌ Désinscrire</button>
                </form>
            </li>
        </ul>

        <!-- Formulaire pour inscrire un nouvel étudiant -->
        <form th:action="@{/teacher/subscribe-student}" method="post">
            <input type="hidden" name="courseId" th:value="${course.id}" />

            <label for="studentId">Ajouter un étudiant :</label>
            <select id="studentId" name="studentId" required class="form-select">
                <option value="" disabled selected>Choisir un étudiant</option>
                <option th:each="student : ${unenrolledStudents}" 
                        th:value="${student.userId}" 
                        th:text="|${student.userId} - ${student.firstName} ${student.lastName}">
                </option>
            </select>

            <button type="submit" class="btn btn-success">➕ Inscrire</button>
        </form>

        <a th:href="@{/teacher/dashboard}" class="back-link">🔙 Retour au tableau de bord</a>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
