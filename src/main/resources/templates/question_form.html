<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Modifier la question' : 'Ajouter une question'"></title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 700px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        textarea {
            resize: none;
        }
        .btn-custom {
            width: 100%;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Dashboard Prof</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
		<!-- Navbar simplifiée -->
		<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
		    <div class="container">
		        <!--a class="navbar-brand" href="#">Dashboard Prof</a-->
		        <div class="d-flex">
		            <a class="btn btn-outline-light" href="/teacher/dashboard">🏠 Accueil</a>
		            <a class="btn btn-outline-light ms-2" href="/logout">🚪 Déconnexion</a>
		        </div>
		    </div>
		</nav>
    </div>
</nav>

<!-- Contenu principal -->
<div class="container">
    <h2 class="text-center mb-4" th:text="${isEdit} ? 'Modifier la question' : 'Ajouter une nouvelle question'"></h2>

    <form th:action="@{/teacher/save-question}" method="post" th:object="${question}">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{exam}" />

        <div class="mb-3">
            <label for="questionTitle" class="form-label">Titre de la question :</label>
            <textarea id="questionTitle" class="form-control" th:field="*{questionTitle}" required></textarea>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Catégorie :</label>
            <input type="text" id="category" class="form-control" th:field="*{category}" required />
        </div>

        <div class="mb-3">
            <label for="difficultyLevel" class="form-label">Difficulté :</label>
            <select id="difficultyLevel" class="form-select" th:field="*{difficultyLevel}">
                <option value="EASY">Facile</option>
                <option value="MEDIUM">Moyen</option>
                <option value="HARD">Difficile</option>
            </select>
        </div>

        <hr>

        <div class="mb-3">
            <label for="option1" class="form-label">Option 1 :</label>
            <input type="text" id="option1" class="form-control" th:field="*{option1}" required />
        </div>

        <div class="mb-3">
            <label for="option2" class="form-label">Option 2 :</label>
            <input type="text" id="option2" class="form-control" th:field="*{option2}" required />
        </div>

        <div class="mb-3">
            <label for="option3" class="form-label">Option 3 :</label>
            <input type="text" id="option3" class="form-control" th:field="*{option3}" required />
        </div>

        <div class="mb-3">
            <label for="option4" class="form-label">Option 4 :</label>
            <input type="text" id="option4" class="form-control" th:field="*{option4}" required />
        </div>

        <div class="mb-3">
            <label for="rightAnswer" class="form-label">Bonne réponse :</label>
            <input type="text" id="rightAnswer" class="form-control" th:field="*{rightAnswer}" required />
        </div>

        <button type="submit" class="btn btn-success btn-lg btn-custom" th:text="${isEdit} ? '💾 Enregistrer' : '➕ Ajouter la question'"></button>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
