<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifier mes informations</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
        .btn-primary, .btn-danger, .btn-secondary {
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Barre de navigation (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Profile</a>
            <div class="d-flex">
                <a th:href="@{/student/dashboard}" class="btn btn-outline-secondary me-2">🏠 Accueil</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-danger">🚪 Déconnexion</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Modifier mes informations</h1>

        <!-- Formulaire de modification -->
        <form th:action="@{/student/edit-profile}" method="post">
			
			<div class="form-group">
                <label for="username">Nom d'utilisateur' :</label>
                <input type="text" id="username" name="username" class="form-control" th:value="${student.username}" readonly required>
            </div>
						
            <div class="form-group">
                <label for="firstName">Prénom :</label>
                <input type="text" id="firstName" name="firstName" class="form-control" th:value="${student.firstName}" required>
            </div>

            <div class="form-group">
                <label for="lastName">Nom :</label>
                <input type="text" id="lastName" name="lastName" class="form-control" th:value="${student.lastName}" required>
            </div>

            <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" class="form-control" th:value="${student.email}" required>
            </div>

			<!-- Le champ password est masqué (ou optionnel) et non modifiable -->
            <div class="form-group">
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" name="password" class="form-control" disabled>
                <small class="form-text text-muted">Laissez vide si vous ne souhaitez pas changer le mot de passe.</small>
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-primary">Mettre à jour</button>
            </div>
        </form>
    </div>

</body>
</html>
