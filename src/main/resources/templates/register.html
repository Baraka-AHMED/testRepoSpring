<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register User</title>
</head>
<body>
    <h2>Register User</h2>
    <form th:action="@{/register}" method="POST" th:object="${user}">
		
		<!-- Insertion du token CSRF -->
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		
        <label for="username">Username:</label>
        <input type="text" id="username" th:field="*{username}" required><br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required><br><br>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" th:field="*{firstName}" required><br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" th:field="*{lastName}" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" th:field="*{password}" required><br><br>

        <!-- Liste déroulante des rôles -->
        <label>Rôle :</label>
        <select name="role" class="form-select">
            <option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:if="${role != 'ADMIN'}"></option>
        </select>
        <br><br>

        <button type="submit">Register</button>
		
		
    </form>
</body>
</html>
